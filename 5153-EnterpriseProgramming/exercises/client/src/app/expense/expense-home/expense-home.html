

<mat-card>
  @if (hasSelectedExpense()) {
  <mat-card-title align="center" style="margin: 1rem">Expense Details</mat-card-title>
  <mat-card-content>
    <app-expense-details [employees]="employees()" [expense]="expenseInDetail()" />
  </mat-card-content>
  } @else {
  <mat-card-title align="center" style="margin: 1rem">Expenses</mat-card-title>
  <mat-card-content>
    <table mat-table [dataSource]="expensesTable">
      <!-- Header -->
      <tr mat-header-row *matHeaderRowDef="tableColumns; sticky: true"></tr>
      <!-- Row Template -->
      <tr mat-row *matRowDef="let expense; columns: tableColumns" (click)="selectExpense(expense)"></tr>
      <!-- ID Column -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>
          <div align="center"></div>
          ID
        </th>
        <td mat-cell *matCellDef="let expense">
          <div align="center"></div>
          {{ expense.id }}
        </td>
      </ng-container>
      <!-- Date Column -->
      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>
          <div align="center">Date</div>
        </th>
        <td mat-cell *matCellDef="let expense">
          <div align="center">{{ expense.date | date : 'MM/dd/yyyy' }}</div>
        </td>
      </ng-container>
      <!-- Employee Column -->
      <ng-container matColumnDef="employeeId">
        <th mat-header-cell *matHeaderCellDef>
          <div align="center">Employee</div>
        </th>
        <td mat-cell *matCellDef="let expense">
          <div align="center">{{ employeeOfId(expense.employeeId)?.lastName ?? 'N/A' }}</div>
        </td>
      </ng-container>
    </table>
  </mat-card-content>
  }
</mat-card>
