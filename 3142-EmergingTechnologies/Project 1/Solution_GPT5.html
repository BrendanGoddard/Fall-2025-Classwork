  .c0  { background:#000000; } /* empty */

/* ======= Rendering helpers ======= */
function makeTable(target, grid) {
  target.innerHTML = "";
  const tbody = document.createElement("tbody");
  grid.forEach(row => {
    const tr = document.createElement("tr");
    row.forEach(v => {
      const td = document.createElement("td");
      td.className = "c" + (v ?? 0);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  target.appendChild(tbody);
}

function sameShape(a, b) {
  return a.length === b.length && a.every((row, i) => row.length === b[i].length);
}
function deepEqual(a, b) {
  if (!sameShape(a,b)) return false;
  for (let r=0;r<a.length;r++) for (let c=0;c<a[0].length;c++) {
    if (a[r][c] !== b[r][c]) return false;
  }
  return true;
}

/* ======= Core solver for 00d62c1b ======= */
/* Rule: fill any rectangle interior (0-cells) that is fully enclosed by 3's with 4's.
   Implementation: for each zero cell, find nearest 3 above/below/left/right; if all exist
   and the rectangle borders are all 3s, fill the interior with 4. */
function solve(grid) {
  const H = grid.length, W = grid[0].length;
  const out = grid.map(row => row.slice());

  const left3  = Array.from({length:H}, () => Array(W).fill(-1));
  const right3 = Array.from({length:H}, () => Array(W).fill(-1));
  const up3    = Array.from({length:H}, () => Array(W).fill(-1));
  const down3  = Array.from({length:H}, () => Array(W).fill(-1));

  // scan rows
  for (let r=0;r<H;r++){
    let last=-1;
    for (let c=0;c<W;c++){ if(grid[r][c]===3) last=c; left3[r][c]=last; }
    last=-1;
    for (let c=W-1;c>=0;c--){ if(grid[r][c]===3) last=c; right3[r][c]=last; }
  }
  // scan cols
  for (let c=0;c<W;c++){
    let last=-1;
    for (let r=0;r<H;r++){ if(grid[r][c]===3) last=r; up3[r][c]=last; }
    last=-1;
    for (let r=H-1;r>=0;r--){ if(grid[r][c]===3) last=r; down3[r][c]=last; }
  }

  const filled = new Set();
  const key = (r,c)=>r+"_"+c;

  for (let r=0;r<H;r++){
    for (let c=0;c<W;c++){
      if (grid[r][c]!==0 || filled.has(key(r,c))) continue;
      const L = left3[r][c], R = right3[r][c], U = up3[r][c], D = down3[r][c];
      if (L<0 || R<0 || U<0 || D<0) continue;
      const r1 = U+1, r2 = D-1, c1 = L+1, c2 = R-1;
      if (r1>r2 || c1>c2) continue;

      // verify rectangular border is all 3's
      let ok = true;
      for (let cc=c1; cc<=c2; cc++){
        if (grid[U][cc]!==3 || grid[D][cc]!==3){ ok=false; break; }
      }
      if (ok){
        for (let rr=r1; rr<=r2; rr++){
          if (grid[rr][L]!==3 || grid[rr][R]!==3){ ok=false; break; }
        }
      }
      if (!ok) continue;

      // fill this interior
      for (let rr=r1; rr<=r2; rr++){
        for (let cc=c1; cc<=c2; cc++){
          out[rr][cc]=4;
          filled.add(key(rr,cc));
        }
      }
    }
  }
  return out;
}

/* ======= UI wiring ======= */
const whichEl = document.getElementById('which');
const inputTable = document.getElementById('inputTable');
const expectedTable = document.getElementById('expectedTable');
const predictedTable = document.getElementById('predictedTable');
const diffTable = document.getElementById('diffTable');
const statusEl = document.getElementById('status');

const options = [
  ...puzzle.train.map((_,i)=>({type:'train', idx:i, label:`Train #${i+1}`})),
  ...puzzle.test.map((_,i)=>({type:'test', idx:i, label:`Test #${i+1}`}))
];

options.forEach((opt,i)=>{
  const o = document.createElement('option');
  o.value = i; o.textContent = opt.label;
  whichEl.appendChild(o);
});

function renderCurrent() {
  const {type, idx} = options[+whichEl.value];
  if (type==='train'){
    const pair = puzzle.train[idx];
    makeTable(inputTable, pair.input);
    makeTable(expectedTable, pair.output);
    const pred = solve(pair.input);
    makeTable(predictedTable, pred);

    // Diff grid: 7 if equal, else 1 (green/red overlay via classes)
    const diff = pair.output.map((row,r)=> row.map((v,c)=> v===pred[r][c] ? 7 : 1));
    makeTable(diffTable, diff);

    const ok = deepEqual(pred, pair.output);
    statusEl.innerHTML = ok ? '<span class="good">✓ Matches expected</span>' :
                              '<span class="bad">✗ Mismatch</span>';
  } else {
    const tc = puzzle.test[idx];
    makeTable(inputTable, tc.input);
    expectedTable.innerHTML = "";
    const pred = solve(tc.input);
    makeTable(predictedTable, pred);
    diffTable.innerHTML = "";
    statusEl.textContent = 'Predicted test output shown.';
  }
}

document.getElementById('solveBtn').addEventListener('click', renderCurrent);
whichEl.addEventListener('change', renderCurrent);
renderCurrent();
